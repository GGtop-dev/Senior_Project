<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>แจ้งเตือน · PPE Inspect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-pending">
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
      <!-- topic bar: ข้อมูลพนักงานวันนี้ -->
      <section class="people-bar" aria-labelledby="people-title">
        <div class="people-head">
          <div class="people-title">
            <span class="alert-icon tone-primary"><span data-icon="users"></span></span>
            <div>
              <h2 class="card-title" id="people-title">พนักงานวันนี้</h2>
              <div class="muted small" id="people-updated">กำลังโหลด…</div>
            </div>
          </div>
          <div class="people-stats" id="people-stats"></div>
        </div>
        <div class="stack" style="gap:8px">
          <div class="people-label">ต้องติดตาม</div>
          <div class="people-cards" id="people-cards"></div>
        </div>
      </section>

      <header class="page-header">
        <div>
          <h1 class="page-title">แจ้งเตือน</h1>
          <p class="page-sub">แจ้งเตือนจากการตรวจและอุปกรณ์ อัปเดตอัตโนมัติ</p>
        </div>
        <div class="actions">
          <button class="btn btn-secondary" id="read-all" type="button"><span data-icon="checkCheck"></span>อ่านแล้วทั้งหมด</button>
        </div>
      </header>

      <div class="banners" id="error"></div>

      <div class="card-row">
        <div class="chips" id="type-chips" role="group" aria-label="ประเภทแจ้งเตือน"></div>
        <div class="actions">
          <label class="field">
            <span data-icon="cpu"></span>
            <select id="device-filter" aria-label="จุดตรวจ"><option value="">ทุกจุดตรวจ</option></select>
          </label>
          <label class="field">
            <span data-icon="calendar"></span>
            <select id="range-filter" aria-label="ช่วงเวลา">
              <option value="24">24 ชั่วโมงล่าสุด</option>
              <option value="168">7 วันล่าสุด</option>
              <option value="720">30 วันล่าสุด</option>
            </select>
          </label>
        </div>
      </div>

      <section class="card flush" aria-label="รายการแจ้งเตือน" id="alert-list">
        <p class="empty">กำลังโหลด…</p>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/alerts.js"></script>
  <script src="js/alerts-page.js"></script>
</body>
</html>
